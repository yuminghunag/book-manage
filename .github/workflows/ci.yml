name: Book Manage CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: 123456
          MYSQL_DATABASE: book_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Init database
        run: |
          mysql -h 127.0.0.1 -u root -p123456 book_db < db/init.sql

      - name: Start server
        run: |
          node app.js &
          sleep 3
          curl -f http://localhost:3000/api/booktype || exit 1

      - name: Test API endpoints
        run: |
          # 测试获取分类
          curl -f http://localhost:3000/api/booktype
          # 测试获取图书列表
          curl -f http://localhost:3000/api/book
          # 测试添加图书
          curl -f -X POST http://localhost:3000/api/book -H "Content-Type: application/json" -d '{"book_name":"测试书籍","author":"测试作者","press":"测试出版社","type_id":1}'
          # 测试获取单条图书
          curl -f http://localhost:3000/api/book/1
