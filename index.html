<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>图书管理系统</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Microsoft YaHei', Arial, sans-serif;
      background-color: #f5f7fa;
      color: #333;
      padding: 20px;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.1);
      padding: 30px;
    }

    h2 {
      text-align: center;
      color: #409eff;
      margin-bottom: 30px;
      font-size: 28px;
    }

    /* 表单样式 */
    .form-box {
      background: #fafafa;
      padding: 20px;
      border-radius: 6px;
      margin-bottom: 30px;
      border: 1px solid #e4e7ed;
    }

    .form-box h3 {
      margin-bottom: 15px;
      color: #606266;
      font-size: 16px;
    }

    .form-row {
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
      margin-bottom: 15px;
    }

    .form-group {
      flex: 1;
      min-width: 200px;
    }

    .form-group label {
      display: block;
      margin-bottom: 5px;
      color: #606266;
      font-weight: 500;
    }

    .form-group input,
    .form-group select {
      width: 100%;
      padding: 10px;
      border: 1px solid #dcdfe6;
      border-radius: 4px;
      font-size: 14px;
      transition: border-color 0.2s;
    }

    .form-group input:focus,
    .form-group select:focus {
      outline: none;
      border-color: #409eff;
    }

    .btn {
      padding: 10px 20px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
      transition: all 0.3s;
    }

    .btn-primary {
      background-color: #409eff;
      color: white;
    }

    .btn-primary:hover {
      background-color: #66b1ff;
    }

    .btn-default {
      background-color: #fff;
      color: #606266;
      border: 1px solid #dcdfe6;
    }

    .btn-default:hover {
      background-color: #f5f7fa;
      border-color: #c0c4cc;
    }

    .btn-success {
      background-color: #67c23a;
      color: white;
    }

    .btn-success:hover {
      background-color: #85ce61;
    }

    .btn-danger {
      background-color: #f56c6c;
      color: white;
    }

    .btn-danger:hover {
      background-color: #f78989;
    }

    .btn-warning {
      background-color: #e6a23c;
      color: white;
    }

    .btn-warning:hover {
      background-color: #ebb563;
    }

    .form-actions {
      display: flex;
      gap: 10px;
      margin-top: 15px;
    }

    /* 筛选区域 */
    .filter-box {
      display: flex;
      align-items: center;
      gap: 15px;
      margin-bottom: 20px;
      padding: 15px;
      background: #f5f7fa;
      border-radius: 6px;
    }

    .filter-box label {
      font-weight: 500;
      color: #606266;
    }

    .filter-box select {
      padding: 8px 12px;
      border: 1px solid #dcdfe6;
      border-radius: 4px;
      min-width: 150px;
    }

    /* 表格样式 */
    .table-wrapper {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: #fff;
    }

    thead {
      background-color: #f5f7fa;
    }

    th {
      padding: 12px 10px;
      text-align: left;
      font-weight: 600;
      color: #606266;
      border-bottom: 2px solid #ebeef5;
    }

    td {
      padding: 12px 10px;
      border-bottom: 1px solid #ebeef5;
    }

    tbody tr:hover {
      background-color: #f5f7fa;
    }

    .action-btns {
      display: flex;
      gap: 8px;
    }

    /* 空状态 */
    .empty-state {
      text-align: center;
      padding: 40px;
      color: #909399;
    }

    /* 加载状态 */
    .loading {
      text-align: center;
      padding: 20px;
      color: #909399;
    }

    /* 消息提示 */
    .message {
      position: fixed;
      top: 20px;
      right: 20px;
      padding: 12px 20px;
      border-radius: 4px;
      color: white;
      font-size: 14px;
      z-index: 1000;
      opacity: 0;
      transition: opacity 0.3s;
    }

    .message.show {
      opacity: 1;
    }

    .message.success {
      background-color: #67c23a;
    }

    .message.error {
      background-color: #f56c6c;
    }

    .message.warning {
      background-color: #e6a23c;
    }

    /* 统计信息 */
    .stats {
      display: flex;
      gap: 20px;
      margin-bottom: 20px;
    }

    .stat-card {
      flex: 1;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 20px;
      border-radius: 8px;
      text-align: center;
    }

    .stat-card h4 {
      font-size: 14px;
      margin-bottom: 8px;
      opacity: 0.9;
    }

    .stat-card .number {
      font-size: 28px;
      font-weight: bold;
    }

    /* 响应式设计 */
    @media (max-width: 768px) {
      .container {
        padding: 15px;
      }

      .form-row {
        flex-direction: column;
      }

      .form-group {
        min-width: 100%;
      }

      .stats {
        flex-direction: column;
      }

      .filter-box {
        flex-direction: column;
        align-items: flex-start;
      }

      table {
        font-size: 12px;
      }

      th, td {
        padding: 8px 5px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>📚 图书管理系统</h2>

    <!-- 统计信息 -->
    <div class="stats">
      <div class="stat-card">
        <h4>图书总数</h4>
        <div class="number" id="totalBooks">0</div>
      </div>
      <div class="stat-card" style="background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);">
        <h4>分类数量</h4>
        <div class="number" id="totalTypes">0</div>
      </div>
    </div>

    <!-- 添加/编辑表单 -->
    <div class="form-box">
      <h3 id="formTitle">📝 添加图书</h3>
      <input type="hidden" id="bookId">
      <div class="form-row">
        <div class="form-group">
          <label>书名 <span style="color: #f56c6c;">*</span></label>
          <input type="text" id="bookName" placeholder="请输入书名">
        </div>
        <div class="form-group">
          <label>作者</label>
          <input type="text" id="author" placeholder="请输入作者">
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>出版社</label>
          <input type="text" id="press" placeholder="请输入出版社">
        </div>
        <div class="form-group">
          <label>分类</label>
          <select id="typeSelect">
            <option value="">请选择分类</option>
          </select>
        </div>
      </div>
      <div class="form-actions">
        <button class="btn btn-primary" onclick="submitBook()">提交</button>
        <button class="btn btn-default" onclick="clearForm()">取消</button>
      </div>
    </div>

    <!-- 筛选区域 -->
    <div class="filter-box">
      <label>筛选分类：</label>
      <select id="filterType" onchange="loadBookList()">
        <option value="">全部图书</option>
      </select>
      <span style="color: #909399; font-size: 14px;" id="filterInfo"></span>
    </div>

    <!-- 图书表格 -->
    <div class="table-wrapper">
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>书名</th>
            <th>作者</th>
            <th>出版社</th>
            <th>分类</th>
            <th>操作</th>
          </tr>
        </thead>
        <tbody id="tableBody">
          <tr>
            <td colspan="6" class="loading">加载中...</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- 消息提示 -->
  <div id="message" class="message"></div>

<script>
const baseUrl = "http://localhost:3000/api";
let isEditing = false;

// 页面加载
window.onload = function(){
  loadTypeList();
  loadBookList();
}

// 显示消息提示
function showMessage(text, type = 'success') {
  const msg = document.getElementById('message');
  msg.textContent = text;
  msg.className = `message ${type} show`;
  setTimeout(() => {
    msg.classList.remove('show');
  }, 3000);
}

// 加载分类下拉
async function loadTypeList(){
  try {
    const res = await fetch(`${baseUrl}/booktype`);
    const result = await res.json();
    const typeList = result.code === 0 ? result.data : [];
    const typeSelect = document.getElementById('typeSelect');
    const filterSelect = document.getElementById('filterType');
    
    typeSelect.innerHTML = "<option value=''>请选择分类</option>";
    filterSelect.innerHTML = `<option value="">全部图书</option>`;
    
    typeList.forEach(item => {
      typeSelect.innerHTML += `<option value="${item.id}">${item.type_name}</option>`;
      filterSelect.innerHTML += `<option value="${item.id}">${item.type_name}</option>`;
    });

    document.getElementById('totalTypes').textContent = typeList.length;
  } catch (err) {
    showMessage("加载分类失败", "error");
  }
}

// 加载图书列表
async function loadBookList(){
  try {
    const tbody = document.getElementById('tableBody');
    tbody.innerHTML = '<tr><td colspan="6" class="loading">加载中...</td></tr>';

    const filterId = document.getElementById('filterType').value;
    let url = `${baseUrl}/book`;
    if(filterId) url += `?typeId=${filterId}`;
    
    const res = await fetch(url);
    const result = await res.json();
    const bookList = result.code === 0 ? result.data : [];

    document.getElementById('totalBooks').textContent = bookList.length;
    
    const filterInfo = document.getElementById('filterInfo');
    if(filterId) {
      const selectedText = document.getElementById('filterType').options[document.getElementById('filterType').selectedIndex].text;
      filterInfo.textContent = `已筛选: ${selectedText}`;
    } else {
      filterInfo.textContent = '';
    }

    if(bookList.length === 0) {
      tbody.innerHTML = '<tr><td colspan="6" class="empty-state">暂无数据</td></tr>';
      return;
    }

    tbody.innerHTML = "";
    bookList.forEach(item => {
      tbody.innerHTML += `
        <tr>
          <td>${item.id}</td>
          <td>${item.book_name}</td>
          <td>${item.author || '-'}</td>
          <td>${item.press || '-'}</td>
          <td>${item.type_name || '-'}</td>
          <td>
            <div class="action-btns">
              <button class="btn btn-warning" onclick="editBook(${item.id})">编辑</button>
              <button class="btn btn-danger" onclick="delBook(${item.id})">删除</button>
            </div>
          </td>
        </tr>
      `;
    });
  } catch (err) {
    showMessage("加载图书列表失败", "error");
    document.getElementById('tableBody').innerHTML = '<tr><td colspan="6" class="empty-state">加载失败</td></tr>';
  }
}

// 提交（新增/修改）
async function submitBook(){
  const bookName = document.getElementById('bookName').value.trim();
  if(!bookName){
    showMessage("书名不能为空", "warning");
    document.getElementById('bookName').focus();
    return;
  }

  const data = {
    book_name: bookName,
    author: document.getElementById('author').value.trim(),
    press: document.getElementById('press').value.trim(),
    type_id: document.getElementById('typeSelect').value
  };

  const id = document.getElementById('bookId').value;
  try {
    if(id){
      await fetch(`${baseUrl}/book/${id}`, {
        method: "PUT",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify(data)
      });
      showMessage("修改成功");
    } else {
      await fetch(`${baseUrl}/book`, {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify(data)
      });
      showMessage("添加成功");
    }
    clearForm();
    loadBookList();
  } catch (err) {
    showMessage("操作失败", "error");
  }
}

// 编辑回填数据
async function editBook(id){
  try {
    const res = await fetch(`${baseUrl}/book/${id}`);
    const result = await res.json();
    if(result.code !== 0 || !result.data){
      showMessage("图书不存在", "error");
      return;
    }
    const book = result.data;
    document.getElementById('bookId').value = book.id;
    document.getElementById('bookName').value = book.book_name;
    document.getElementById('author').value = book.author || '';
    document.getElementById('press').value = book.press || '';
    document.getElementById('typeSelect').value = book.type_id;
    
    document.getElementById('formTitle').textContent = '✏️ 编辑图书';
    isEditing = true;
  } catch (err) {
    showMessage("获取图书信息失败", "error");
  }
}

// 删除
async function delBook(id){
  if(!confirm("确认删除该图书？")) return;
  try {
    await fetch(`${baseUrl}/book/${id}`, {method: "DELETE"});
    showMessage("删除成功");
    loadBookList();
  } catch (err) {
    showMessage("删除失败", "error");
  }
}

// 清空表单
function clearForm(){
  document.getElementById('bookId').value = "";
  document.getElementById('bookName').value = "";
  document.getElementById('author').value = "";
  document.getElementById('press').value = "";
  document.getElementById('typeSelect').value = "";
  document.getElementById('formTitle').textContent = '📝 添加图书';
  isEditing = false;
}
</script>
</body>
</html>
