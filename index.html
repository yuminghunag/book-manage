<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>图书借阅系统-后台管理</title>
  <style>
    body { font-family: "宋体", SimSun, serif; background:#fff; margin:0; padding:20px; }
    h2 { text-align:center; font-size:22px; font-weight:bold; margin:30px 0; }
    .query-bar { text-align:center; margin:20px 0; font-size:14px; }
    .query-bar input { width:200px; height:22px; border:1px solid #7f9db9; }
    .btn { height:24px; padding:0 12px; font-size:12px; cursor:pointer; }
    .btn-query { background:#e8f4fd; border:1px solid #7f9db9; color:#000; }
    .btn-add { background:#f0f0f0; border:1px solid #999; color:#000; margin:10px 0 10px 60px; }
    table { border-collapse:collapse; width:90%; margin:0 auto; font-size:12px; }
    th { background:#808080; color:#fff; border:1px solid #ccc; padding:6px; font-weight:bold; }
    td { border:1px solid #ccc; padding:6px; text-align:center; }
    tr:nth-child(even) { background:#d9d9d9; }
    tr:nth-child(odd) { background:#fff; }
    .op a { color:#0000ee; text-decoration:underline; margin:0 3px; cursor:pointer; }
    .page-bar { text-align:center; margin:20px 0; font-size:12px; }
    .page-bar a { color:#000; text-decoration:underline; margin:0 4px; cursor:pointer; }
    .page-bar span.num { margin:0 3px; cursor:pointer; text-decoration:underline; }
    .page-bar span.cur { text-decoration:none; font-weight:bold; }
    .page-bar input { width:35px; height:18px; border:1px solid #999; }
  </style>
</head>
<body>
  <h2>图书借阅系统-后台管理</h2>

  <!-- 查询区 -->
  <div class="query-bar">
    图书名称：<input type="text" id="queryName">
    <button class="btn btn-query" onclick="doQuery()">查询</button>
  </div>

  <!-- 新增按钮 -->
  <div>
    <button class="btn btn-add" onclick="location.href='add.html'">新增</button>
  </div>

  <!-- 图书列表 -->
  <table>
    <thead>
      <tr>
        <th>图书编号</th>
        <th>图书分类</th>
        <th>图书名称</th>
        <th>作者</th>
        <th>出版社</th>
        <th>入库时间</th>
        <th>是否借阅</th>
        <th>操作</th>
      </tr>
    </thead>
    <tbody id="bookList"></tbody>
  </table>

  <!-- 分页 -->
  <div class="page-bar" id="pageBar"></div>

<script>
const baseUrl = "http://localhost:3000/api";
let curPage = 1;
const pageSize = 5;

window.onload = function(){ loadList(); };

// 查询
function doQuery(){
  curPage = 1;
  loadList();
}

// 加载列表
async function loadList(){
  const name = document.getElementById('queryName').value;
  const url = `${baseUrl}/book?bookName=${encodeURIComponent(name)}&page=${curPage}&pageSize=${pageSize}`;
  const res = await fetch(url);
  const result = await res.json();
  const { list, total, totalPages } = result.data;

  const tbody = document.getElementById('bookList');
  tbody.innerHTML = "";
  list.forEach(item=>{
    tbody.innerHTML += `
      <tr>
        <td>${item.bookCode}</td>
        <td>${item.typeName}</td>
        <td>${item.bookName}</td>
        <td>${item.bookAuthor}</td>
        <td>${item.publishPress}</td>
        <td>${item.creationTime}</td>
        <td>${item.borrowed == 1 ? '已借阅' : '未借阅'}</td>
        <td class="op">
          <a onclick="viewBook(${item.bookId})">查看</a>
          <a onclick="editBook(${item.bookId})">修改</a>
          <a onclick="delBook(${item.bookId})">删除</a>
        </td>
      </tr>`;
  });

  renderPageBar(totalPages, total);
}

// 渲染分页条
function renderPageBar(totalPages, total){
  const bar = document.getElementById('pageBar');
  let html = '';
  html += `<a onclick="gotoPage(${curPage-1})">上一页</a>`;
  html += ` ◄ `;
  for(let i=1; i<=totalPages; i++){
    if(i === curPage){
      html += `<span class="num cur">${i}</span>`;
    } else {
      html += `<span class="num" onclick="gotoPage(${i})">${i}</span>`;
    }
  }
  html += ` ► `;
  html += `<a onclick="gotoPage(${curPage+1})">下一页</a>`;
  html += ` 共${totalPages}页 到第 <input type="text" id="jumpPage"> 页 <button class="btn btn-query" onclick="jumpTo()">确定</button>`;
  bar.innerHTML = html;
}

// 跳转页
function gotoPage(p){
  curPage = p;
  loadList();
}
function jumpTo(){
  const p = parseInt(document.getElementById('jumpPage').value, 10);
  if(p && p >= 1){
    curPage = p;
    loadList();
  }
}

// 查看
function viewBook(id){
  location.href = `view.html?id=${id}`;
}
// 修改
function editBook(id){
  location.href = `edit.html?id=${id}`;
}
// 删除
async function delBook(id){
  if(!confirm("确定删除该条图书信息？")) return;
  const res = await fetch(`${baseUrl}/book/${id}`, {method:"DELETE"});
  const result = await res.json();
  if(result.code === 0){
    alert("删除成功！");
  } else {
    alert("删除失败！");
  }
  loadList();
}
</script>
</body>
</html>
